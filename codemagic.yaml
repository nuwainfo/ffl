workflows:
  ffl-mac-test:
    name: FFL macOS test
    instance_type: mac_mini_m2
    max_build_duration: 30

    scripts:
      - name: Check macOS environment
        script: |
          echo "=== macOS ==="
          sw_vers

          echo "=== Architecture ==="
          uname -m

          echo "=== Hardware ==="
          sysctl -n machdep.cpu.brand_string || true

          echo "=== Xcode ==="
          xcodebuild -version

          echo "=== Python ==="
          python3 --version

          echo "=== Git ==="
          git --version

          echo "=== SVN ==="
          svn --version --quiet || true
