workflows:
  ffl-mac-test:
    name: FFL macOS 15 test
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      xcode: 16.4

    scripts:
      - name: Check macOS environment
        script: |
          echo "=== macOS ==="
          sw_vers

          echo "=== Architecture ==="
          uname -m

          echo "=== Xcode ==="
          xcodebuild -version

      - name: Install SVN
        script: |
          echo "=== Installing Subversion ==="
          brew install subversion

          echo "=== SVN version ==="
          svn --version --quiet
