workflows:
  ffl-cli-macos:
    name: FFL CLI ARM64 + x86_64
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: 16.4
      groups:
        - SVN

    scripts:
      - name: Verify macOS runner
        script: |
          set -euo pipefail

          echo "=== macOS ==="
          sw_vers

          echo "=== Native architecture ==="
          uname -m

          echo "=== Xcode ==="
          xcodebuild -version

      - name: Install SVN, Rust and Rosetta
        script: |
          set -euo pipefail

          echo "=== SVN ==="
          if ! command -v svn >/dev/null 2>&1; then
            brew install subversion
          fi
          svn --version --quiet

          echo "=== Rust ==="
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi

          export PATH="$HOME/.cargo/bin:$PATH"
          rustup default stable
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

          rustc --version
          cargo --version
          rustup show

          echo "=== Rosetta 2 ==="
          if ! /usr/sbin/pkgutil --pkg-info com.apple.pkg.RosettaUpdateAuto >/dev/null 2>&1; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          else
            echo "Rosetta package is already installed."
          fi

          echo "Native uname: $(uname -m)"
          echo "Translated uname: $(/usr/bin/arch -x86_64 /usr/bin/uname -m)"

          if [ "$(/usr/bin/arch -x86_64 /usr/bin/uname -m)" != "x86_64" ]; then
            echo "ERROR: Rosetta x86_64 execution is not available"
            exit 1
          fi

      - name: Install Miniconda and create fileshare environment
        script: |
          set -euo pipefail

          echo "=== Miniconda ARM64 host environment ==="
          if [ ! -x "$HOME/miniconda3/bin/conda" ]; then
            curl -fsSL \
              -o /tmp/Miniconda3.sh \
              https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-arm64.sh

            bash /tmp/Miniconda3.sh \
              -b \
              -p "$HOME/miniconda3"
          fi

          source "$HOME/miniconda3/etc/profile.d/conda.sh"
          conda --version

          if ! conda env list | awk '{print $1}' | grep -qx fileshare; then
            echo "=== Creating fileshare conda environment ==="
            conda create -y -n fileshare python=3.12
          fi

          conda activate fileshare
          python --version
          python -c 'import platform; print("Python arch:", platform.machine())'

      - name: Checkout private SVN source
        script: |
          set -euo pipefail

          FFL_DIR="$HOME/FFL"

          echo "=== Recreate $FFL_DIR ==="
          rm -rf "$FFL_DIR"
          mkdir -p "$FFL_DIR"

          echo "=== Checkout FileShareServer ==="
          svn checkout \
            "$SVN_FILESHARE_SERVER_URL" \
            "$FFL_DIR/FileShareServer" \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive \
            --no-auth-cache

          echo "=== Checkout FileShare ==="
          svn checkout \
            "$SVN_FILESHARE_URL" \
            "$FFL_DIR/FileShare" \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive \
            --no-auth-cache

          echo "=== Checkout result ==="
          test -d "$FFL_DIR/FileShare/.svn"
          test -d "$FFL_DIR/FileShareServer/.svn"
          test -f "$FFL_DIR/FileShare/scripts/MacOSBuild.sh"

          echo "FileShare revision:"
          svn info "$FFL_DIR/FileShare" | grep -E '^(URL|Revision):'

          echo "FileShareServer revision:"
          svn info "$FFL_DIR/FileShareServer" | grep -E '^(URL|Revision):'

      - name: Build ARM64 and x86_64 CLI with MacOSBuild.sh
        script: |
          set -euo pipefail

          export PATH="$HOME/.cargo/bin:$PATH"

          BUILD_SCRIPT="$HOME/FFL/FileShare/scripts/MacOSBuild.sh"
          chmod +x "$BUILD_SCRIPT"

          echo "=== Running existing build entry point ==="
          "$BUILD_SCRIPT" cli

          ARM_BIN="$HOME/FFL/FileShare/dist/mac/ffl_aarch64"
          X86_BIN="$HOME/FFL/FileShare/dist/mac/ffl_x86_64"

          echo "=== CLI artifacts ==="
          ls -lah "$HOME/FFL/FileShare/dist/mac"

          for bin in "$ARM_BIN" "$X86_BIN"; do
            if [ ! -x "$bin" ]; then
              echo "ERROR: CLI artifact missing or not executable: $bin"
              exit 1
            fi
          done

          echo "=== ARM64 binary info ==="
          file "$ARM_BIN"
          lipo -info "$ARM_BIN"
          shasum -a 256 "$ARM_BIN"

          echo "=== x86_64 binary info ==="
          file "$X86_BIN"
          lipo -info "$X86_BIN"
          shasum -a 256 "$X86_BIN"

          echo "=== Native ARM64 startup test ==="
          "$ARM_BIN" --version

          echo "=== Rosetta x86_64 startup test ==="
          /usr/bin/arch -x86_64 "$X86_BIN" --version

      - name: Test ARM64 and x86_64 FFL with real downloads
        script: |
          set -euo pipefail

          ARM_BIN="$HOME/FFL/FileShare/dist/mac/ffl_aarch64"
          X86_BIN="$HOME/FFL/FileShare/dist/mac/ffl_x86_64"

          test_real_download() {
            local label="$1"
            local arch_mode="$2"
            local ffl_bin="$3"
            local test_number="$4"

            local safe_label
            safe_label="$(echo "$label" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9_')"
            local share_file="/tmp/ffl_${safe_label}"
            local share_json="/tmp/ffl_share_${safe_label}.json"

            echo
            echo "============================================================"
            echo "FFL REAL DOWNLOAD TEST $test_number/2: $label"
            echo "============================================================"

            if [ ! -x "$ffl_bin" ]; then
              echo "ERROR: FFL binary not found or not executable: $ffl_bin"
              exit 1
            fi

            file "$ffl_bin"
            shasum -a 256 "$ffl_bin"

            if [ "$arch_mode" = "x86_64" ]; then
              echo "=== Verify x86_64 process through Rosetta ==="
              /usr/bin/arch -x86_64 "$ffl_bin" --version
            else
              echo "=== Verify native ARM64 process ==="
              "$ffl_bin" --version
            fi

            # Share a byte-for-byte copy instead of the running executable itself.
            cp "$ffl_bin" "$share_file"
            chmod +x "$share_file"
            rm -f "$share_json"

            echo "=== Starting $label FFL self-test server ==="

            if [ "$arch_mode" = "x86_64" ]; then
              /usr/bin/arch -x86_64 "$ffl_bin" "$share_file" \
                --json "$share_json" \
                --max-downloads 1 &
            else
              "$ffl_bin" "$share_file" \
                --json "$share_json" \
                --max-downloads 1 &
            fi

            local ffl_pid=$!
            local wait_count=0

            echo "Waiting for FFL to generate download URL..."

            while [ ! -s "$share_json" ]; do
              if ! kill -0 "$ffl_pid" 2>/dev/null; then
                echo "ERROR: $label FFL terminated before generating a link."
                wait "$ffl_pid"
                exit 1
              fi

              wait_count=$((wait_count + 1))

              if [ "$wait_count" -ge 60 ]; then
                echo "ERROR: Timed out waiting for $label download link."
                kill "$ffl_pid" 2>/dev/null || true
                wait "$ffl_pid" 2>/dev/null || true
                exit 1
              fi

              sleep 1
            done

            local download_url
            download_url="$(
              python3 - "$share_json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as f:
              data = json.load(f)

          print(data["link"])
          PY
            )"

            echo
            echo "============================================================"
            echo "FFL $label BUILD TEST READY ($test_number/2)"
            echo
            echo "CLICK THIS LINK TO DOWNLOAD THE JUST-BUILT $label BINARY:"
            echo
            echo "$download_url"
            echo
            echo "Waiting for exactly one successful download..."
            echo "--max-downloads 1 will stop FFL after the download completes."
            echo "============================================================"
            echo

            wait "$ffl_pid"

            echo
            echo "============================================================"
            echo "✅ FFL $label REAL DOWNLOAD TEST PASSED"
            echo "============================================================"
          }

          test_real_download "ARM64" "arm64" "$ARM_BIN" "1"
          test_real_download "x86_64" "x86_64" "$X86_BIN" "2"

          echo
          echo "============================================================"
          echo "✅ BOTH macOS CLI ARCHITECTURES PASSED"
          echo "============================================================"

    artifacts:
      - $HOME/FFL/FileShare/dist/mac/ffl_aarch64
      - $HOME/FFL/FileShare/dist/mac/ffl_x86_64

  ffl-macos-signing-check:
    name: FFL macOS signing check
    instance_type: mac_mini_m2
    max_build_duration: 15

    integrations:
      app_store_connect: Codemagic FFL

    environment:
      xcode: 16.4
      groups:
        - ffl_signing
      vars:
        BUNDLE_ID: "com.nuwainfo.ffl"

    scripts:
      - name: Verify signing environment
        script: |
          set -euo pipefail

          echo "=== macOS ==="
          sw_vers

          echo "=== Native architecture ==="
          uname -m

          echo "=== Xcode ==="
          xcodebuild -version

          echo "=== Check CERTIFICATE_PRIVATE_KEY ==="
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY is not available from ffl_signing"
            exit 1
          fi

          echo "CERTIFICATE_PRIVATE_KEY is available."

      - name: Initialize temporary keychain
        script: |
          set -euo pipefail

          echo "=== Initialize temporary Codemagic keychain ==="
          keychain initialize

      - name: Fetch Mac App Distribution certificate and App Store profile
        script: |
          set -euo pipefail

          echo "=== Fetch/create Mac App Distribution + Mac App Store profile ==="

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform MAC_OS \
            --type MAC_APP_STORE \
            --create

      - name: Create Mac Installer Distribution certificate
        script: |
          set -euo pipefail

          echo "=== Create Mac Installer Distribution certificate ==="

          app-store-connect certificates list \
            --type MAC_INSTALLER_DISTRIBUTION \
            --save

      - name: Import certificates into temporary keychain
        script: |
          set -euo pipefail

          echo "=== Import certificates ==="
          keychain add-certificates

      - name: Verify signing materials
        script: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo "CODE SIGNING IDENTITIES"
          echo "============================================================"

          security find-identity -v -p codesigning

          echo
          echo "============================================================"
          echo "ALL CERTIFICATES SAVED BY CODEMAGIC"
          echo "============================================================"

          CERTIFICATES_JSON="$(keychain list-certificates)"
          echo "$CERTIFICATES_JSON"

          echo
          echo "============================================================"
          echo "VERIFY APP DISTRIBUTION CERTIFICATE"
          echo "============================================================"

          APP_CERT_NAME="$(
            printf '%s\n' "$CERTIFICATES_JSON" \
              | jq -r '.[] | select(.common_name | contains("Apple Distribution")) | .common_name' \
              | head -n 1
          )"

          if [ -z "$APP_CERT_NAME" ]; then
            echo "ERROR: Apple Distribution certificate was not imported."
            exit 1
          fi

          echo "App Distribution certificate:"
          echo "$APP_CERT_NAME"

          echo
          echo "============================================================"
          echo "VERIFY MAC INSTALLER DISTRIBUTION CERTIFICATE"
          echo "============================================================"

          INSTALLER_CERT_NAME="$(
            printf '%s\n' "$CERTIFICATES_JSON" \
              | jq -r '.[] | select(.common_name | contains("Mac Developer Installer")) | .common_name' \
              | head -n 1
          )"

          if [ -z "$INSTALLER_CERT_NAME" ]; then
            echo "ERROR: Mac Installer Distribution certificate was not imported."
            exit 1
          fi

          echo "Mac Installer Distribution certificate:"
          echo "$INSTALLER_CERT_NAME"

          echo
          echo "============================================================"
          echo "PROVISIONING PROFILE"
          echo "============================================================"

          PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"

          if [ ! -d "$PROFILE_DIR" ]; then
            echo "ERROR: Provisioning profile directory does not exist:"
            echo "$PROFILE_DIR"
            exit 1
          fi

          PROFILE=""
          PROFILE_PLIST="/tmp/ffl-profile.plist"

          while IFS= read -r candidate; do
            rm -f "$PROFILE_PLIST"

            if ! security cms -D -i "$candidate" > "$PROFILE_PLIST" 2>/dev/null; then
              continue
            fi

            APP_ID="$(
              /usr/libexec/PlistBuddy \
                -c 'Print :Entitlements:com.apple.application-identifier' \
                "$PROFILE_PLIST" 2>/dev/null || true
            )"

            if [ -z "$APP_ID" ]; then
              APP_ID="$(
                /usr/libexec/PlistBuddy \
                  -c 'Print :Entitlements:application-identifier' \
                  "$PROFILE_PLIST" 2>/dev/null || true
              )"
            fi

            case "$APP_ID" in
              *."$BUNDLE_ID")
                PROFILE="$candidate"
                break
                ;;
            esac
          done < <(
            find "$PROFILE_DIR" -type f \
              \( -name '*.provisionprofile' -o -name '*.mobileprovision' \)
          )

          if [ -z "$PROFILE" ]; then
            echo "ERROR: No provisioning profile matching $BUNDLE_ID was found."
            exit 1
          fi

          echo "Matching profile:"
          echo "$PROFILE"

          security cms -D -i "$PROFILE" > "$PROFILE_PLIST"

          echo
          echo "=== Profile details ==="

          echo -n "Name: "
          /usr/libexec/PlistBuddy \
            -c 'Print :Name' \
            "$PROFILE_PLIST"

          echo -n "UUID: "
          /usr/libexec/PlistBuddy \
            -c 'Print :UUID' \
            "$PROFILE_PLIST"

          echo -n "Expiration: "
          /usr/libexec/PlistBuddy \
            -c 'Print :ExpirationDate' \
            "$PROFILE_PLIST"

          APP_ID="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:com.apple.application-identifier' \
              "$PROFILE_PLIST" 2>/dev/null || true
          )"

          if [ -z "$APP_ID" ]; then
            APP_ID="$(
              /usr/libexec/PlistBuddy \
                -c 'Print :Entitlements:application-identifier' \
                "$PROFILE_PLIST"
            )"
          fi

          echo "Application identifier: $APP_ID"

          case "$APP_ID" in
            *."$BUNDLE_ID")
              echo "OK: provisioning profile matches $BUNDLE_ID"
              ;;
            *)
              echo "ERROR: provisioning profile does not match $BUNDLE_ID"
              exit 1
              ;;
          esac

          echo
          echo "============================================================"
          echo "✅ FFL MACOS SIGNING CHECK PASSED"
          echo "============================================================"


  ffl-gui-appstore:
    name: FFL GUI ARM64 → App Store Connect (existing Release.sh)
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic FFL

    environment:
      xcode: 16.4
      groups:
        - SVN
        - ffl_signing
      vars:
        BUNDLE_ID: "com.nuwainfo.ffl"

    scripts:
      - name: Verify macOS ARM64 and signing secret
        script: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          test "$(uname -m)" = "arm64"
          test -n "${CERTIFICATE_PRIVATE_KEY:-}"

      - name: Install ARM64 Miniconda and SVN
        script: |
          set -euo pipefail

          if ! command -v svn >/dev/null 2>&1; then
            brew install subversion
          fi

          if [ ! -x "$HOME/miniconda3/bin/conda" ]; then
            curl -fsSL \
              -o /tmp/Miniconda3.sh \
              https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-arm64.sh

            bash /tmp/Miniconda3.sh -b -p "$HOME/miniconda3"
          fi

          source "$HOME/miniconda3/etc/profile.d/conda.sh"
          conda --version

          if ! conda env list | awk '{print $1}' | grep -qx fileshare; then
            conda create -y -n fileshare python=3.12
          fi

          conda activate fileshare
          python --version
          python -c 'import platform; assert platform.machine() == "arm64"'

      - name: Checkout original SVN source
        script: |
          set -euo pipefail
          FFL_DIR="$HOME/FFL"

          rm -rf "$FFL_DIR"
          mkdir -p "$FFL_DIR"

          svn checkout \
            "$SVN_FILESHARE_SERVER_URL" \
            "$FFL_DIR/FileShareServer" \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive \
            --no-auth-cache

          svn checkout \
            "$SVN_FILESHARE_URL" \
            "$FFL_DIR/FileShare" \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive \
            --no-auth-cache

          test -f "$FFL_DIR/FileShare/scripts/MacOSBuild.sh"
          test -f "$FFL_DIR/FileShare/dist/mac/Release.sh"
          test -f "$FFL_DIR/FileShare/dist/Darwin.spec"

          if ! grep -q 'FFL_APP_STORE_PROFILE' "$FFL_DIR/FileShare/dist/mac/Release.sh"; then
            echo "ERROR: SVN dist/mac/Release.sh has not been updated."
            exit 1
          fi

          if ! grep -q 'FFL_SKIP_SVN_UPDATE' "$FFL_DIR/FileShare/scripts/MacOSBuild.sh"; then
            echo "ERROR: SVN scripts/MacOSBuild.sh has not been updated."
            exit 1
          fi

          echo "=== FFL SVN revision ==="
          svn info "$FFL_DIR/FileShare" | grep -E '^(URL|Revision):'

      - name: Prepare temporary App Store signing materials
        script: |
          set -euo pipefail

          # Give Codemagic's temporary keychain a known, explicit path.
          # Do not infer it from security default-keychain -d user.
          KEYCHAIN_PATH="$HOME/Library/codemagic-cli-tools/keychains/ffl-appstore.keychain-db"
          mkdir -p "$(dirname "$KEYCHAIN_PATH")"
          keychain initialize --path "$KEYCHAIN_PATH"
          test -f "$KEYCHAIN_PATH" || {
            echo "ERROR: Codemagic temporary keychain was not created."
            exit 1
          }

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform MAC_OS \
            --type MAC_APP_STORE \
            --create

          # The Installer Distribution certificate has already been created.
          # Fetch it on each build; do NOT create duplicate certificates.
          app-store-connect certificates list \
            --type MAC_INSTALLER_DISTRIBUTION \
            --save

          # Original Release.sh invokes both codesign and productbuild.
          # This is an isolated temporary CI keychain, NOT the user's login keychain.
          # Grant noninteractive key use to the signing tools without GUI prompts.
          # Tradeoff: all applications in this CI job can access these temporary keys.
          keychain add-certificates --path "$KEYCHAIN_PATH" \
            --allow-all-applications

          # Also grant noninteractive Apple signing-tool key partitions.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "" "$KEYCHAIN_PATH"

          # Certificate entries alone are insufficient: both signing identities
          # must have a usable matching private key in this keychain.
          echo "=== Valid signing identities in temporary keychain ==="
          IDENTITIES="$(security find-identity -v "$KEYCHAIN_PATH")"
          printf '%s\n' "$IDENTITIES"
          if ! printf '%s\n' "$IDENTITIES" | grep -Fq \
            '"Apple Distribution: Nuwa Information Ltd. (F7YCS8BBQT)"'; then
            echo "ERROR: App Distribution certificate/private-key identity is missing."
            exit 1
          fi
          if ! printf '%s\n' "$IDENTITIES" | grep -Fq \
            '"3rd Party Mac Developer Installer: Nuwa Information Ltd. (F7YCS8BBQT)"'; then
            echo "ERROR: Mac Installer certificate/private-key identity is missing."
            exit 1
          fi

          CERTS_TEXT="$(keychain list-certificates --path "$KEYCHAIN_PATH")"

          if ! printf '%s\n' "$CERTS_TEXT" | grep -Fq \
            '"common_name": "Apple Distribution: Nuwa Information Ltd. (F7YCS8BBQT)"'; then
            echo "ERROR: Apple Distribution certificate not found."
            exit 1
          fi

          if ! printf '%s\n' "$CERTS_TEXT" | grep -Fq \
            '"common_name": "3rd Party Mac Developer Installer: Nuwa Information Ltd. (F7YCS8BBQT)"'; then
            echo "ERROR: Mac Installer Distribution certificate not found."
            exit 1
          fi

          # Catch both private-key permission failures before an expensive GUI build.
          # This creates only disposable local test files and never uploads them.
          echo "=== Preflight: codesign and productbuild ==="
          CHECK_DIR="$(mktemp -d /tmp/ffl-signing-preflight.XXXXXX)"
          trap 'rm -rf "$CHECK_DIR"' EXIT
          CHECK_APP="$CHECK_DIR/FFLSigningCheck.app"
          mkdir -p "$CHECK_APP/Contents/MacOS"

          cat > "$CHECK_DIR/check.c" <<'CHECKC'
          int main(void) { return 0; }
          CHECKC
          xcrun clang -arch arm64 "$CHECK_DIR/check.c" \
            -o "$CHECK_APP/Contents/MacOS/FFLSigningCheck"

          python3 - "$CHECK_APP/Contents/Info.plist" <<'CHECKPLIST'
          import plistlib
          import sys
          info = {
              "CFBundleExecutable": "FFLSigningCheck",
              "CFBundleIdentifier": "com.nuwainfo.ffl.signingcheck",
              "CFBundleName": "FFLSigningCheck",
              "CFBundlePackageType": "APPL",
              "CFBundleShortVersionString": "1.0",
              "CFBundleVersion": "1",
          }
          with open(sys.argv[1], "wb") as f:
              plistlib.dump(info, f)
          CHECKPLIST

          codesign --force --options runtime --timestamp \
            --sign "Apple Distribution: Nuwa Information Ltd. (F7YCS8BBQT)" \
            "$CHECK_APP"

          productbuild \
            --component "$CHECK_APP" /Applications \
            --sign "3rd Party Mac Developer Installer: Nuwa Information Ltd. (F7YCS8BBQT)" \
            "$CHECK_DIR/FFLSigningCheck.pkg"
          pkgutil --check-signature "$CHECK_DIR/FFLSigningCheck.pkg"
          echo "=== Preflight passed: codesign + productbuild ==="

          PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          PROFILE=""
          PROFILE_PLIST="/tmp/ffl-codemagic-profile.plist"

          test -d "$PROFILE_DIR"

          while IFS= read -r candidate; do
            if ! security cms -D -i "$candidate" > "$PROFILE_PLIST" 2>/dev/null; then
              continue
            fi

            APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$PROFILE_PLIST" 2>/dev/null || true)"

            if [ -z "$APP_ID" ]; then
              APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST" 2>/dev/null || true)"
            fi

            if [ "$APP_ID" = "F7YCS8BBQT.$BUNDLE_ID" ]; then
              PROFILE="$candidate"
              break
            fi
          done < <(
            find "$PROFILE_DIR" -type f \
              \( -name '*.provisionprofile' -o -name '*.mobileprovision' \)
          )

          if [ -z "$PROFILE" ]; then
            echo "ERROR: No Mac App Store profile matching F7YCS8BBQT.$BUNDLE_ID"
            exit 1
          fi

          echo "=== New profile selected ==="
          echo "$PROFILE"

          # Keep SVN's old profile untouched. Release.sh reads this fresh file.
          printf 'FFL_APP_STORE_PROFILE=%s\n' "$PROFILE" >> "$CM_ENV"
          printf 'FFL_CI_APPSTORE=1\n' >> "$CM_ENV"

      - name: Build and sign GUI using original MacOSBuild.sh store
        script: |
          set -euo pipefail

          source "$HOME/miniconda3/etc/profile.d/conda.sh"
          conda activate fileshare

          # MacOSBuild.sh may optionally run its old altool upload if this is set.
          # Codemagic publishing owns the upload in this workflow.
          unset APP_STORE_PASSWORD
          export FFL_SKIP_SVN_UPDATE=1

          BUILD_SCRIPT="$HOME/FFL/FileShare/scripts/MacOSBuild.sh"
          chmod +x "$BUILD_SCRIPT"

          echo "=== Run original GUI App Store build chain ==="
          echo "MacOSBuild.sh store -> Build.sh -> Release.sh AppleStore -> productbuild"
          "$BUILD_SCRIPT" store

      - name: Validate existing .app and signed .pkg
        script: |
          set -euo pipefail

          APP="$HOME/FFL/FileShare/dist/dist/FastFileLink.app"
          PKG="$HOME/FFL/FileShare/dist/mac/FastFileLink.pkg"

          test -d "$APP"
          test -f "$PKG"

          echo "=== Verify application architecture ==="
          file "$APP/Contents/MacOS/FastFileLink"
          lipo -info "$APP/Contents/MacOS/FastFileLink"
          lipo "$APP/Contents/MacOS/FastFileLink" -verify_arch arm64

          echo "=== Verify App Store bundle metadata ==="
          BUNDLE_ID_ACTUAL="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")"
          test "$BUNDLE_ID_ACTUAL" = "$BUNDLE_ID"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist"

          echo "=== Verify freshly embedded profile ==="
          cmp -s "$FFL_APP_STORE_PROFILE" "$APP/Contents/embedded.provisionprofile"

          echo "=== Verify signed app and package ==="
          codesign --verify --deep --strict --verbose=4 "$APP"
          pkgutil --check-signature "$PKG"

          mkdir -p "$CM_BUILD_DIR/artifacts"
          cp -f "$PKG" "$CM_BUILD_DIR/artifacts/FastFileLink.pkg"
          shasum -a 256 "$CM_BUILD_DIR/artifacts/FastFileLink.pkg"

          echo "=== FFL ARM64 App Store pkg is ready ==="

    artifacts:
      - artifacts/FastFileLink.pkg

    publishing:
      app_store_connect:
        auth: integration
