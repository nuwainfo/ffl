workflows:
  ffl-cli-arm:
    name: FFL CLI ARM64
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: 16.4
      groups:
        - SVN

    scripts:
      - name: Verify macOS runner
        script: |
          set -e

          echo "=== macOS ==="
          sw_vers

          echo "=== Architecture ==="
          uname -m

          echo "=== Xcode ==="
          xcodebuild -version

      - name: Install SVN and Rust
        script: |
          set -e

          echo "=== SVN ==="
          if ! command -v svn >/dev/null 2>&1; then
            brew install subversion
          fi
          svn --version --quiet

          echo "=== Rust ==="
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi

          export PATH="$HOME/.cargo/bin:$PATH"
          rustup default stable
          rustup target add aarch64-apple-darwin

          rustc --version
          cargo --version
          rustup show

      - name: Install Miniconda and create fileshare environment
        script: |
          set -e

          echo "=== Miniconda ==="
          if [ ! -x "$HOME/miniconda3/bin/conda" ]; then
            curl -fsSL \
              -o /tmp/Miniconda3.sh \
              https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-arm64.sh

            bash /tmp/Miniconda3.sh \
              -b \
              -p "$HOME/miniconda3"
          fi

          source "$HOME/miniconda3/etc/profile.d/conda.sh"
          conda --version

          if ! conda env list | awk '{print $1}' | grep -qx fileshare; then
            echo "=== Creating fileshare conda environment ==="
            conda create -y -n fileshare python=3.12
          fi

          conda activate fileshare
          python --version
          python -c 'import platform; print("Python arch:", platform.machine())'

      - name: Checkout private SVN source
        script: |
          set -e

          FFL_DIR="$HOME/FFL"

          echo "=== Recreate $FFL_DIR ==="
          rm -rf "$FFL_DIR"
          mkdir -p "$FFL_DIR"

          echo "=== Checkout FileShareServer ==="
          svn checkout \
            "$SVN_FILESHARE_SERVER_URL" \
            "$FFL_DIR/FileShareServer" \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive \
            --no-auth-cache

          echo "=== Checkout FileShare ==="
          svn checkout \
            "$SVN_FILESHARE_URL" \
            "$FFL_DIR/FileShare" \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive \
            --no-auth-cache

          echo "=== Checkout result ==="
          test -d "$FFL_DIR/FileShare/.svn"
          test -d "$FFL_DIR/FileShareServer/.svn"
          test -f "$FFL_DIR/FileShare/tests/scripts/MacOSBuild.sh"

          echo "FileShare revision:"
          svn info "$FFL_DIR/FileShare" | grep -E '^(URL|Revision):'

          echo "FileShareServer revision:"
          svn info "$FFL_DIR/FileShareServer" | grep -E '^(URL|Revision):'

      - name: Build CLI with MacOSBuild.sh
        script: |
          set -e

          export PATH="$HOME/.cargo/bin:$PATH"

          BUILD_SCRIPT="$HOME/FFL/FileShare/tests/scripts/MacOSBuild.sh"
          chmod +x "$BUILD_SCRIPT"

          echo "=== Running existing build entry point ==="
          "$BUILD_SCRIPT" cli

          echo "=== CLI artifacts ==="
          ls -lah "$HOME/FFL/FileShare/dist/mac" || true

          if [ ! -f "$HOME/FFL/FileShare/dist/mac/ffl_aarch64" ]; then
            echo "ERROR: ffl_aarch64 was not produced"
            exit 1
          fi

          echo "=== ARM64 binary info ==="
          file "$HOME/FFL/FileShare/dist/mac/ffl_aarch64"
          lipo -info "$HOME/FFL/FileShare/dist/mac/ffl_aarch64" || true
          shasum -a 256 "$HOME/FFL/FileShare/dist/mac/ffl_aarch64"

      - name: Test built FFL with real download
        script: |
          set -euo pipefail

          FFL_BIN="$HOME/FFL/FileShare/dist/mac/ffl_aarch64"
          SHARE_FILE="/tmp/ffl_aarch64"
          SHARE_JSON="/tmp/ffl-share.json"

          echo "=== Verify built binary ==="

          if [ ! -x "$FFL_BIN" ]; then
            echo "ERROR: FFL binary not found or not executable:"
            echo "$FFL_BIN"
            exit 1
          fi

          file "$FFL_BIN"
          "$FFL_BIN" --version

          echo
          echo "=== SHA256 ==="
          shasum -a 256 "$FFL_BIN"

          # Share a byte-for-byte copy instead of the currently running executable itself.
          cp "$FFL_BIN" "$SHARE_FILE"
          chmod +x "$SHARE_FILE"

          rm -f "$SHARE_JSON"

          echo
          echo "=== Starting FFL self-test server ==="

          "$FFL_BIN" "$SHARE_FILE" \
            --json "$SHARE_JSON" \
            --max-downloads 1 &

          FFL_PID=$!

          echo "Waiting for FFL to generate download URL..."

          WAIT_COUNT=0
          while [ ! -s "$SHARE_JSON" ]; do
            if ! kill -0 "$FFL_PID" 2>/dev/null; then
              echo "ERROR: FFL terminated before generating a link."
              wait "$FFL_PID"
              exit 1
            fi

            WAIT_COUNT=$((WAIT_COUNT + 1))

            if [ "$WAIT_COUNT" -ge 60 ]; then
              echo "ERROR: Timed out waiting for download link."
              kill "$FFL_PID" 2>/dev/null || true
              wait "$FFL_PID" 2>/dev/null || true
              exit 1
            fi

            sleep 1
          done

          DOWNLOAD_URL="$(
            python3 - "$SHARE_JSON" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as f:
              data = json.load(f)

          print(data["link"])
          PY
          )"

          echo
          echo "============================================================"
          echo "FFL BUILD TEST READY"
          echo
          echo "CLICK THIS LINK TO DOWNLOAD THE JUST-BUILT BINARY:"
          echo
          echo "$DOWNLOAD_URL"
          echo
          echo "Waiting for exactly one successful download..."
          echo "The build will continue automatically after the download."
          echo "============================================================"
          echo

          wait "$FFL_PID"

          echo
          echo "============================================================"
          echo "✅ FFL REAL DOWNLOAD TEST PASSED"
          echo "The newly built binary successfully served one download."
          echo "============================================================"          

    artifacts:
      - $HOME/FFL/FileShare/dist/mac/ffl_*
