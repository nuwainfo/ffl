name: Deploy CLI site to GitHub Pages

# Publishes docs/site on every push to main that changes it; can also be run by hand.
# One-time setup: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - docs/site/**
      - .github/workflows/cli-site-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-site-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: docs/site/test-results
          retention-days: 7
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
