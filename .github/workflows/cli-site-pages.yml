name: Deploy CLI site to GitHub Pages

# Opt-in deployment: enable Pages (GitHub Actions source), then run this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-site-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
        working-directory: docs/site
      - run: npm run build
        working-directory: docs/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
