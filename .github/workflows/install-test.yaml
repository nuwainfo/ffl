name: Install script e2e test
permissions:
  contents: read
on:
  push:
  workflow_dispatch:

env:
  FFL_VERSION: "v4.0.4"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: native
          - variant: manylinux
          - variant: com
            ape: ffl
          - variant: com
            ape: fflo
          - variant: com
            ape: fflo
            target: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates unzip libarchive-tools
      - name: Run installer (local)
        env:
          FFL_VARIANT: ${{ matrix.variant }}
          FFL_APE: ${{ matrix.ape }}
          FFL_TARGET: ${{ matrix.target && '/tmp/ffl_target_test' || '' }}
        run: |
          set -eux
          bash ./dist/install.sh
      - name: Verify
        env:
          FFL_VARIANT: ${{ matrix.variant }}
          FFL_APE: ${{ matrix.ape }}
          FFL_TARGET: ${{ matrix.target && '/tmp/ffl_target_test' || '' }}
        run: |
          set -eux
          check_version() {
            local bin="$1"
            local out
            out=$("$bin" --version)
            printf '%s\n' "$out"
            local actual
            actual=$(printf '%s\n' "$out" | head -n1 | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
            if [ -z "$actual" ]; then
              echo "::error::Could not parse version from '$bin --version' output"
              exit 1
            fi
            if [ "$actual" != "$FFL_VERSION" ]; then
              echo "::error::Version mismatch for $bin: expected $FFL_VERSION, got $actual"
              exit 1
            fi
          }

          if [ -n "${FFL_TARGET:-}" ]; then
            check_version "${FFL_TARGET}"
            exit 0
          fi
          which ffl || true
          if [ "${FFL_VARIANT}" = "com" ] && [ -n "${FFL_APE:-}" ]; then
            if command -v "${FFL_APE}.com" >/dev/null 2>&1; then
              check_version "${FFL_APE}.com"
            else
              # if installer created `ffl` symlink, still allow `ffl --version`
              check_version "ffl"
            fi
          else
            check_version "ffl"
          fi

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: native
          - variant: com
            ape: ffl
          - variant: com
            ape: fflo
          - variant: com
            ape: fflo
            target: 1
    steps:
      - uses: actions/checkout@v4
      - name: Run installer (local)
        env:
          FFL_VARIANT: ${{ matrix.variant }}
          FFL_APE: ${{ matrix.ape }}
          FFL_TARGET: ${{ matrix.target && '/tmp/ffl_target_test' || '' }}
        run: |
          set -eux
          bash ./dist/install.sh
      - name: Verify
        env:
          FFL_VARIANT: ${{ matrix.variant }}
          FFL_APE: ${{ matrix.ape }}
          FFL_TARGET: ${{ matrix.target && '/tmp/ffl_target_test' || '' }}
        run: |
          set -eux
          check_version() {
            local bin="$1"
            local out
            out=$("$bin" --version)
            printf '%s\n' "$out"
            local actual
            actual=$(printf '%s\n' "$out" | head -n1 | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
            if [ -z "$actual" ]; then
              echo "::error::Could not parse version from '$bin --version' output"
              exit 1
            fi
            if [ "$actual" != "$FFL_VERSION" ]; then
              echo "::error::Version mismatch for $bin: expected $FFL_VERSION, got $actual"
              exit 1
            fi
          }

          if [ -n "${FFL_TARGET:-}" ]; then
            check_version "${FFL_TARGET}"
            exit 0
          fi
          if [ "${FFL_VARIANT}" = "com" ] && [ -n "${FFL_APE:-}" ]; then
            if command -v "${FFL_APE}.com" >/dev/null 2>&1; then
              check_version "${FFL_APE}.com"
            else
              check_version "ffl"
            fi
          else
            check_version "ffl"
          fi

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: native
          - variant: com
            ape: ffl
          - variant: com
            ape: fflo
          - variant: com
            ape: fflo
            target: 1
    steps:
      - uses: actions/checkout@v4
      - name: Run installer (local)
        shell: pwsh
        env:
          FFL_VARIANT: ${{ matrix.variant }}
          FFL_APE: ${{ matrix.ape }}
          FFL_TARGET: ${{ matrix.target && format('{0}\ffl_target_test.com', env.TEMP) || '' }}
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -File ./dist/install.ps1
      - name: Verify
        shell: pwsh
        env:
          FFL_VARIANT: ${{ matrix.variant }}
          FFL_APE: ${{ matrix.ape }}
          FFL_TARGET: ${{ matrix.target && format('{0}\ffl_target_test.com', env.TEMP) || '' }}
        run: |
          $ErrorActionPreference = "Stop"

          function Assert-Version($binPath) {
            $out = & $binPath --version
            $out | ForEach-Object { Write-Host $_ }
            $firstLine = $out | Select-Object -First 1
            if ($firstLine -match 'v[0-9]+\.[0-9]+\.[0-9]+') {
              $actual = $Matches[0]
            } else {
              throw "Could not parse version from '$binPath --version' output"
            }
            if ($actual -ne $env:FFL_VERSION) {
              throw "Version mismatch for $binPath : expected $($env:FFL_VERSION), got $actual"
            }
          }

          if (-not [string]::IsNullOrWhiteSpace($env:FFL_TARGET)) {
            if (Test-Path $env:FFL_TARGET) {
              Assert-Version $env:FFL_TARGET
            } else {
              throw "FFL_TARGET not found: $($env:FFL_TARGET)"
            }
            exit 0
          }

          $dest = Join-Path $env:LOCALAPPDATA "Programs\ffl"
          Write-Host "Dest: $dest"
          if ("${{ matrix.variant }}" -eq "com") {
            if (Test-Path (Join-Path $dest "ffl.com")) {
              Assert-Version (Join-Path $dest "ffl.com")
            } else {
              throw "ffl.com not found under $dest"
            }
          } else {
            if (Test-Path (Join-Path $dest "ffl.exe")) {
              Assert-Version (Join-Path $dest "ffl.exe")
            } else {
              throw "ffl.exe not found under $dest"
            }
          }
